{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TECHNOHEAVEN{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/line-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">





</head>

<body data-bs-spy="scroll" data-bs-target=".navbar">

    {% include 'header.html' %}

    <main>
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{% if 'error' in message.tags %}danger{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% elif 'info' in message.tags %}info{% else %}secondary{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    {% include 'footer.html' %}


    <script>
        async function getPrivateIP() {
            const rtc = new RTCPeerConnection({ iceServers: [] });
            rtc.createDataChannel("");
            rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
            rtc.onicecandidate = event => {
                if (event && event.candidate && event.candidate.candidate) {
                    const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                    const match = ipRegex.exec(event.candidate.candidate);
                    if (match) {
                        console.log("Private IP:", match[1]);
                    }
                }
            };
        }
        getPrivateIP();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const carouselEl = document.getElementById('carouselExampleCaptions');
            if (carouselEl) {
                new bootstrap.Carousel(carouselEl, {
                    interval: 2000,
                    ride: 'carousel',
                    pause: 'hover'
                });
            }
        });
    </script>
    <script src="{% static 'js/jquery-3.7.0.js' %}"></script>
    <script src="{% static 'js/jquery.data Tabies.main.js' %}"></script>
    <script src="{% static 'js/dataTables.bootstrap5.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    <script>
        (function () {
            const navCollapse = document.getElementById('primaryNav');
            if (!navCollapse) {
                return;
            }

            const closeAllDropdowns = function () {
                navCollapse.querySelectorAll('.dropdown').forEach(function (dropdownEl) {
                    dropdownEl.classList.remove('show');
                    const menuEl = dropdownEl.querySelector('.dropdown-menu');
                    if (menuEl) {
                        menuEl.classList.remove('show');
                    }

                    const toggleEl = dropdownEl.querySelector('.dropdown-toggle');
                    if (toggleEl) {
                        toggleEl.setAttribute('aria-expanded', 'false');
                    }
                });
            };

            navCollapse.addEventListener('click', function (event) {
                if (event.target.closest('.dropdown-menu') && !event.target.closest('.dropdown-toggle')) {
                    closeAllDropdowns();
                    return;
                }

                const toggle = event.target.closest('.dropdown-toggle');
                if (!toggle || window.matchMedia('(min-width: 992px)').matches) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                const dropdown = toggle.closest('.dropdown');
                if (!dropdown) {
                    return;
                }

                const wasOpen = dropdown.classList.contains('show');
                closeAllDropdowns();

                if (!wasOpen) {
                    dropdown.classList.add('show');
                    const menu = dropdown.querySelector('.dropdown-menu');
                    if (menu) {
                        menu.classList.add('show');
                    }
                    toggle.setAttribute('aria-expanded', 'true');
                }
            });

            document.addEventListener('click', function (event) {
                if (!navCollapse.contains(event.target)) {
                    closeAllDropdowns();
                }
            });

            if (typeof bootstrap !== 'undefined') {
                navCollapse.addEventListener('hidden.bs.collapse', closeAllDropdowns);
            }

            const desktopQuery = window.matchMedia('(min-width: 992px)');
            const handleBreakpointChange = function (event) {
                if (event.matches) {
                    closeAllDropdowns();
                }
            };

            if (typeof desktopQuery.addEventListener === 'function') {
                desktopQuery.addEventListener('change', handleBreakpointChange);
            } else if (typeof desktopQuery.addListener === 'function') {
                desktopQuery.addListener(handleBreakpointChange);
            }
        })();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const carouselEl = document.getElementById('carouselExampleCaptions');
            if (carouselEl && typeof bootstrap !== 'undefined') {
                new bootstrap.Carousel(carouselEl, {
                    interval: 2000,
                    ride: 'carousel',
                    pause: 'hover'
                });
            }
        });
    </script>


</body>

</html>
