{% extends 'base.html' %}
{% block title %}Reset your password{% endblock %}

{% block content %}

<section class="page-hero">
  <div class="container">
    <span class="eyebrow"><i class="fa-solid fa-lock"></i> Secure reset</span>
    <h1>Verify code & set a new password</h1>
    <p class="theme-meta">We sent an OTP to <strong>{{ email }}</strong>. Enter it below with your new password.</p>
  </div>
</section>

<section class="section-pad auth-section d-flex align-items-center" style="min-height: 60vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="glass-card theme-form" data-aos="fade-up">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="resetOtp">OTP code</label>
              <input id="resetOtp" class="form-control" type="text" name="otp" maxlength="6" placeholder="e.g. 123456" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="newPass1">New password</label>
              <div class="password-wrapper">
                <input id="newPass1" class="form-control" type="password" name="password1" required>
                <button type="button" class="password-toggle" data-target="newPass1" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="newPass2">Confirm password</label>
              <div class="password-wrapper">
                <input id="newPass2" class="form-control" type="password" name="password2" required>
                <button type="button" class="password-toggle" data-target="newPass2" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
              </div>
            </div>
            <button class="theme-btn w-100 justify-content-center" type="submit">Reset password</button>
          </form>
          <div class="mt-3 text-center">
            <a class="theme-link" href="{% url 'forgot_password' %}">Request a new OTP</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleButtons = document.querySelectorAll('.password-toggle');
    toggleButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isHidden = input.getAttribute('type') === 'password';
        input.setAttribute('type', isHidden ? 'text' : 'password');
        btn.innerHTML = isHidden ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
      });
    });
  });
</script>

{% endblock %}
